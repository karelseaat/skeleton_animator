[animations.keyframes.bones.Body]
rot = 0.0
[animations.keyframes.bones.Head]
rot = 0.0
[animations.keyframes.bones.UpperArm_L]
rot = 10.0
[animations.keyframes.bones.LowerArm_L]
rot = -5.0
[animations.keyframes.bones.UpperArm_R]
rot = -10.0
[animations.keyframes.bones.LowerArm_R]
rot = 5.0
[animations.keyframes.bones.UpperLeg_L]
rot = 0.0
[animations.keyframes.bones.LowerLeg_L]
rot = 0.0
[animations.keyframes.bones.UpperLeg_R]
rot = 0.0
[animations.keyframes.bones.LowerLeg_R]
rot = 0.0

[[animations.keyframes]]
time = 1.0
# Bob Down / Breathe
[animations.keyframes.bones.Hips]
y = 110.0
easing = "in_out_quad"
[animations.keyframes.bones.Body]
rot = 0.0
[animations.keyframes.bones.Head]
rot = 2.0
[animations.keyframes.bones.UpperArm_L]
rot = 15.0
[animations.keyframes.bones.UpperArm_R]
rot = -15.0

[[animations.keyframes]]
time = 2.0
# Return to Idle
[animations.keyframes.bones.Hips]
y = 100.0
easing = "in_out_quad"
[animations.keyframes.bones.Head]
rot = 0.0
[animations.keyframes.bones.UpperArm_L]
rot = 10.0
[animations.keyframes.bones.UpperArm_R]
rot = -10.0
